<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="cenini mark"><title>cenini mark</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.beam{transform-origin:50px 50px;animation:sweep 8s linear infinite}@keyframes sweep{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g transform="translate(0 0) scale(0.9600)"><g stroke="#e5197e" stroke-width="3"><line x1="35" y1="50" x2="65" y2="50"/><line x1="36.5" y1="41" x2="36.5" y2="59"/><line x1="63.5" y1="41" x2="63.5" y2="59"/></g><circle cx="20" cy="50" r="15" fill="#141414"/><circle cx="80" cy="50" r="15" fill="#b08d3c"/></g></svg>